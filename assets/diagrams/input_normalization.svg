<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfa753" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#dfa753" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <line x1="50" y1="60" x2="550" y2="60" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
  <line x1="50" y1="140" x2="550" y2="140" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
  <line x1="50" y1="220" x2="550" y2="220" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4" />
  <line x1="420" y1="30" x2="420" y2="280" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Input Nodes -->
  <!-- 01 Trackpad -->
  <rect x="50" y="44" width="100" height="32" rx="6" fill="#0b101e" stroke="rgba(255,255,255,0.12)" />
  <text x="100" y="64" fill="#94a3b8" font-family="Space Mono, monospace" font-size="11" text-anchor="middle">TRACKPAD</text>
  <path d="M 150 60 C 260 60, 340 140, 420 140" stroke="url(#grad-cyan)" stroke-width="2" fill="none" />

  <!-- 02 Mouse Wheel -->
  <rect x="50" y="124" width="100" height="32" rx="6" fill="#0b101e" stroke="rgba(255,255,255,0.12)" />
  <text x="100" y="144" fill="#94a3b8" font-family="Space Mono, monospace" font-size="11" text-anchor="middle">MOUSE WHEEL</text>
  <path d="M 150 140 L 420 140" stroke="url(#grad-gold)" stroke-width="2" fill="none" />

  <!-- 03 Mobile Touch -->
  <rect x="50" y="204" width="100" height="32" rx="6" fill="#0b101e" stroke="rgba(255,255,255,0.12)" />
  <text x="100" y="224" fill="#94a3b8" font-family="Space Mono, monospace" font-size="11" text-anchor="middle">TOUCH GESTURE</text>
  <path d="M 150 220 C 260 220, 340 140, 420 140" stroke="url(#grad-cyan)" stroke-width="2" fill="none" />

  <!-- Unified Convergence Core (Lenis Normalization Engine) -->
  <circle cx="420" cy="140" r="14" fill="#030712" stroke="#dfa753" stroke-width="3" filter="url(#glow)" />
  <circle cx="420" cy="140" r="5" fill="#dfa753" />
  
  <!-- Single Normalized Output Stream -->
  <path d="M 434 140 L 540 140" stroke="#dfa753" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="546,140 536,134 536,146" fill="#dfa753" />
  
  <rect x="440" y="80" width="120" height="24" rx="4" fill="rgba(223, 167, 83, 0.12)" stroke="#dfa753" stroke-width="1" />
  <text x="500" y="96" fill="#dfa753" font-family="Space Mono, monospace" font-size="9" font-weight="bold" text-anchor="middle">1 FEEL, EVERY INPUT</text>

  <!-- Status Monospace -->
  <text x="50" y="280" fill="#64748b" font-family="Space Mono, monospace" font-size="10">NORMALIZATION: DELTA-Y UNIFIED (LERP 0.08)</text>
  <text x="550" y="280" fill="#38bdf8" font-family="Space Mono, monospace" font-size="10" text-anchor="end">60 FPS SYNCHRONIZED</text>
</svg>
