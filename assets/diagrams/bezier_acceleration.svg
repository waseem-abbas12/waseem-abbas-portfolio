<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="grad-bezier" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfa753" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#dfa753" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow-bezier" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Axes -->
  <line x1="70" y1="40" x2="70" y2="240" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <line x1="70" y1="240" x2="540" y2="240" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <text x="60" y="45" fill="#64748b" font-family="Space Mono, monospace" font-size="9" text-anchor="end">VELOCITY</text>
  <text x="540" y="255" fill="#64748b" font-family="Space Mono, monospace" font-size="9" text-anchor="end">TIME (MS)</text>

  <!-- Linear Dull Falloff (Standard) -->
  <line x1="70" y1="240" x2="500" y2="70" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
  <text x="420" y="110" fill="#64748b" font-family="Space Mono, monospace" font-size="9">LINEAR INTERPOLATION</text>

  <!-- Lenis Organic Inertial Cubic Bezier Curve -->
  <path d="M 70 240 C 220 240, 260 60, 500 60" 
        stroke="url(#grad-bezier)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow-bezier)" />
  <circle cx="500" cy="60" r="5" fill="#38bdf8" />
  
  <!-- Tangent Handles Visualizer -->
  <circle cx="220" cy="240" r="3.5" fill="#dfa753" />
  <circle cx="260" cy="60" r="3.5" fill="#38bdf8" />
  <line x1="70" y1="240" x2="220" y2="240" stroke="#dfa753" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="260" y1="60" x2="500" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

  <rect x="180" y="28" width="180" height="22" rx="4" fill="rgba(223, 167, 83, 0.15)" stroke="#dfa753" stroke-width="1" />
  <text x="270" y="43" fill="#dfa753" font-family="Space Mono, monospace" font-size="9" font-weight="bold" text-anchor="middle">CUBIC-BEZIER(0.16, 1, 0.3, 1)</text>

  <!-- Monospace Telemetry -->
  <text x="70" y="280" fill="#94a3b8" font-family="Space Mono, monospace" font-size="10">EASING: OUT-EXPO (ORGANIC INERTIAL DECAY)</text>
  <text x="540" y="280" fill="#38bdf8" font-family="Space Mono, monospace" font-size="10" text-anchor="end">VIRTUAL MOMENTUM</text>
</svg>
