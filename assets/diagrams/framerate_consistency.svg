<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="grad-smooth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow-smooth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Coordinate Grid -->
  <line x1="60" y1="50" x2="60" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <line x1="60" y1="250" x2="550" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- Grid Ticks & Labels -->
  <text x="50" y="55" fill="#64748b" font-family="Space Mono, monospace" font-size="9" text-anchor="end">60 FPS</text>
  <text x="50" y="150" fill="#64748b" font-family="Space Mono, monospace" font-size="9" text-anchor="end">30 FPS</text>
  <text x="50" y="250" fill="#64748b" font-family="Space Mono, monospace" font-size="9" text-anchor="end">0 FPS</text>
  
  <!-- Jitter curve (Standard Native Browser lag) -->
  <path d="M 60 160 L 90 140 L 120 180 L 160 120 L 200 170 L 250 130 L 300 200 L 350 140 L 400 190 L 450 130 L 520 160" 
        stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  <text x="280" y="215" fill="#ef4444" font-family="Space Mono, monospace" font-size="9" opacity="0.8">UNMANAGED BROWSER JITTER (30-45 FPS)</text>

  <!-- Lenis + GSAP Locked Smooth 60 FPS Curve -->
  <path d="M 60 70 C 180 70, 300 70, 520 70" 
        stroke="url(#grad-smooth)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-smooth)" />
  <circle cx="520" cy="70" r="5" fill="#38bdf8" />
  
  <rect x="360" y="38" width="160" height="22" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="440" y="53" fill="#38bdf8" font-family="Space Mono, monospace" font-size="9" font-weight="bold" text-anchor="middle">LOCKED 60 FPS FLUIDITY</text>

  <!-- Monospace Telemetry -->
  <text x="60" y="285" fill="#94a3b8" font-family="Space Mono, monospace" font-size="10">FRAME DELAY: 16.6MS CONSTANT • ZERO FRAME DROPS</text>
  <text x="550" y="285" fill="#dfa753" font-family="Space Mono, monospace" font-size="10" text-anchor="end">GPU COMPOSITED</text>
</svg>
